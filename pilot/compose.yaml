name: copilot-only-pilot
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    env_file: ../private/pilot/db.env
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pilot -d pilot']
      interval: 2s
      timeout: 2s
      retries: 30
  fixture:
    image: python:3.11-slim@sha256:ef442c44cde6d7aec39ae63dad1ced44fa7290790d68c028686cdd2e31a76a95
    command: ['python', '/pilot/fixture.py']
    volumes: ['./fixture.py:/pilot/fixture.py:ro']
  gateway:
    image: ghcr.io/berriai/litellm:v1.108.0@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
    env_file: ../private/pilot/gateway.env
    command: ['--config', '/pilot/config.yaml', '--port', '4000']
    volumes:
      - ../private/pilot/config.yaml:/pilot/config.yaml:ro
    ports: ['127.0.0.1:4198:4000']
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
