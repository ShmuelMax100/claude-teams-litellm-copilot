[project]
name = "fusion-mcp"
version = "0.1.0"
description = "Per-user GitHub Copilot Fusion model adapter and MCP service"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "uvicorn==0.38.0", "microsoft-copilot-sdk==2.0.1", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
