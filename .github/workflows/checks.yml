name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test onboarding and wrapper
        run: python3 -m unittest discover -s tests
      - name: Rebuild guide from repository sources
        run: python3 tools/build_guide.py
      - name: Check package and generated guide
        run: python3 tools/check_package.py
      - name: Check public distribution content
        run: python3 tools/check_public.py
      - name: Ensure generated files are current
        run: git diff --exit-code -- START-HERE.html tools/guide-commands.json
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verified service and test dependencies
        run: python -m pip install --require-hashes -r services/fusion-mcp/requirements-dev.lock
      - name: Run service and independent security tests with mocked Copilot SDK
        working-directory: services/fusion-mcp
        run: timeout --kill-after=10s 120s python -m pytest -q -o faulthandler_timeout=30
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.5
      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers without remote state
        run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=infra/terraform validate
      - name: Run offline mocked deployment plans
        run: terraform -chdir=infra/terraform test
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the production Fusion container
        run: docker build --tag fusion-mcp:local services/fusion-mcp
      - name: Probe the real SDK runtime without network access
        run: >-
          timeout --kill-after=10s 90s docker run --rm --network none --read-only --tmpfs /tmp
          --mount type=bind,src="$PWD/tests/integration/offline_probe.py",dst=/qa/offline_probe.py,readonly
          fusion-mcp:local python /qa/offline_probe.py
      - name: Verify real SDK text and client-tool contracts with a local provider
        run: >-
          timeout --kill-after=10s 90s docker run --rm --network none --read-only --tmpfs /tmp
          --env PYTHONPATH=/app
          --mount type=bind,src="$PWD/services/fusion-mcp/tests/runtime_contract_probe.py",dst=/qa/runtime_contract_probe.py,readonly
          fusion-mcp:local python /qa/runtime_contract_probe.py
      - name: Verify pinned LiteLLM fallback hooks and credential isolation
        run: >-
          timeout --kill-after=10s 120s docker run --rm --network none --entrypoint python
          --mount type=bind,src="$PWD/services/litellm-fusion-guard",dst=/qa,readonly
          ghcr.io/berriai/litellm:v1.108.0@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
          /qa/check_runtime.py
      - name: Test the pinned gateway with synthetic providers
        run: python3 tests/integration/run.py
